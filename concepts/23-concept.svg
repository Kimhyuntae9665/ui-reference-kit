<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="결론 앞의 가정을 보이다 · 미구현 시안 · 합성 예시"><g font-family="Malgun Gothic,Segoe UI,sans-serif"><rect x="0" y="0" width="900" height="500" rx="0" fill="#f7f8f5" stroke="none"/><text x="30" y="31" font-size="16" fill="#566976" font-weight="600" text-anchor="start">23 / CAUSAL ASSUMPTION GRAPH</text><text x="30" y="67" font-size="28" fill="#203340" font-weight="650" text-anchor="start">결론 앞의 가정을 보이다</text><text x="30" y="96" font-size="16" fill="#566976" font-weight="400" text-anchor="start">원인 가설과 관측 사실을 분리합니다. 연결선은 검증 전의 인과 가설입니다.</text><text x="35" y="137" font-size="18" fill="#566976" font-weight="600" text-anchor="start">가능한 원인</text><text x="310" y="137" font-size="18" fill="#566976" font-weight="600" text-anchor="start">관측 결과</text><text x="606" y="137" font-size="18" fill="#566976" font-weight="600" text-anchor="start">판단에 필요한 가정</text><rect x="35" y="160" width="210" height="73" rx="0" fill="#dbedf0" stroke="#167d8d"/><text x="51" y="190" font-size="20" fill="#203340" font-weight="600" text-anchor="start">분할 납품 가설</text><text x="51" y="216" font-size="16" fill="#566976" font-weight="400" text-anchor="start">아직 20개 미도착?</text><rect x="35" y="282" width="210" height="73" rx="0" fill="#f5e6cc" stroke="#b97822"/><text x="51" y="312" font-size="20" fill="#203340" font-weight="600" text-anchor="start">계약 변경 가설</text><text x="51" y="338" font-size="16" fill="#566976" font-weight="400" text-anchor="start">단가 +800 합의?</text><rect x="310" y="160" width="242" height="73" rx="0" fill="#ffffff" stroke="#167d8d"/><text x="326" y="190" font-size="20" fill="#203340" font-weight="600" text-anchor="start">현재 입고 80개</text><text x="326" y="216" font-size="16" fill="#566976" font-weight="400" text-anchor="start">발주·청구는 각 100개</text><rect x="310" y="282" width="242" height="73" rx="0" fill="#ffffff" stroke="#b97822"/><text x="326" y="312" font-size="20" fill="#203340" font-weight="600" text-anchor="start">청구 단가 10,800원</text><text x="326" y="338" font-size="16" fill="#566976" font-weight="400" text-anchor="start">발주 단가 10,000원</text><line x1="245" y1="196" x2="310" y2="196" stroke="#167d8d" stroke-width="2"/><path d="M303 191 L310 196 L303 201" fill="none" stroke="#167d8d" stroke-width="2"/><line x1="245" y1="318" x2="310" y2="318" stroke="#b97822" stroke-width="2"/><path d="M303 313 L310 318 L303 323" fill="none" stroke="#b97822" stroke-width="2"/><text x="265" y="181" font-size="20" fill="#566976" font-weight="600" text-anchor="start">？</text><rect x="610" y="160" width="250" height="73" rx="0" fill="#f0f3f1" stroke="#b9c7cd"/><text x="625" y="190" font-size="18" fill="#203340" font-weight="600" text-anchor="start">입고 기록이 완전함</text><text x="625" y="216" font-size="16" fill="#566976" font-weight="400" text-anchor="start">누락 영수증이 없는가</text><rect x="610" y="282" width="250" height="73" rx="0" fill="#f0f3f1" stroke="#b9c7cd"/><text x="625" y="312" font-size="18" fill="#203340" font-weight="600" text-anchor="start">동일 계약·동일 품목</text><text x="625" y="338" font-size="16" fill="#566976" font-weight="400" text-anchor="start">변경 합의가 없는가</text><path d="M552 196H592M610 196H592V387" stroke="#566976" stroke-width="2" fill="none" stroke-dasharray="5 5"/><path d="M552 318H592M610 318H592" stroke="#566976" stroke-width="2" fill="none" stroke-dasharray="5 5"/><rect x="310" y="385" width="550" height="57" rx="0" fill="#edf4f4" stroke="#167d8d"/><text x="328" y="419" font-size="18" fill="#203340" font-weight="600" text-anchor="start">가정 확인 후: 수량 차이 20개 · 단가 차이 +800원</text><text x="35" y="402" font-size="16" fill="#566976" font-weight="400" text-anchor="start">실선: 원인 가설</text><text x="35" y="430" font-size="16" fill="#566976" font-weight="400" text-anchor="start">점선: 판단 조건</text><line x1="30" y1="460" x2="870" y2="460" stroke="#b9c7cd" stroke-width="1"/><text x="30" y="486" font-size="16" fill="#566976" font-weight="600" text-anchor="start">미구현 시안 · 합성 예시</text><text x="870" y="486" font-size="16" fill="#566976" font-weight="400" text-anchor="end">STATIC CONCEPT STUDY</text></g></svg>
