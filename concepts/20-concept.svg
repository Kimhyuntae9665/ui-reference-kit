<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="Matchroom 스타일 구상 · 미구현"><defs><pattern id="grid-20" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#778570" stroke-opacity=".12"/></pattern></defs><g font-family="Malgun Gothic,Segoe UI,sans-serif"><rect x="0" y="0" width="900" height="500" rx="0" fill="#e6ecdd" stroke="none"/><rect x="27" y="24" width="846" height="410" rx="0" fill="#fffdf7" stroke="none"/><text x="45" y="56" font-size="14" fill="#354638" font-weight="650" text-anchor="start">MATCHROOM</text><text x="850" y="56" font-size="12" fill="#84917f" font-weight="400" text-anchor="end">정산을 이해하는 한 화면</text><line x1="45" y1="75" x2="850" y2="75" stroke="#bbc6b4" stroke-width="1" /><text x="47" y="135" font-size="43" fill="#294b3b" font-weight="650" text-anchor="start">발주는 100개.</text><text x="47" y="190" font-size="43" fill="#294b3b" font-weight="650" text-anchor="start">입고는 80개.</text><text x="49" y="224" font-size="16" fill="#7d8e7c" font-weight="400" text-anchor="start">청구서에는 100개와 더 높은 단가가 적혀 있습니다.</text><rect x="515" y="111" width="38" height="168" rx="0" fill="#93b194" stroke="none"/><rect x="566" y="145" width="38" height="134" rx="0" fill="#b6c6a4" stroke="none"/><rect x="617" y="111" width="38" height="168" rx="0" fill="#ceb086" stroke="none"/><text x="534" y="300" font-size="13" fill="#74896f" font-weight="600" text-anchor="middle">PO</text><text x="585" y="300" font-size="13" fill="#74896f" font-weight="600" text-anchor="middle">입고</text><text x="636" y="300" font-size="13" fill="#74896f" font-weight="600" text-anchor="middle">청구</text><line x1="511" y1="144" x2="659" y2="144" stroke="#a17940" stroke-width="1.5" stroke-dasharray="4 4"/><text x="710" y="159" font-size="62" fill="#aa7a3d" font-weight="650" text-anchor="middle">20</text><text x="710" y="186" font-size="14" fill="#a18a66" font-weight="400" text-anchor="middle">개 차이</text><text x="706" y="243" font-size="25" fill="#9a7847" font-weight="650" text-anchor="middle">+800원</text><text x="706" y="266" font-size="13" fill="#a18a66" font-weight="400" text-anchor="middle">단가 차이</text><line x1="45" y1="327" x2="850" y2="327" stroke="#bbc6b4" stroke-width="1" /><text x="47" y="364" font-size="20" fill="#3b5d48" font-weight="650" text-anchor="start">사람이 결정할 지점</text><text x="47" y="394" font-size="15" fill="#7d8e7c" font-weight="400" text-anchor="start">원본을 확인하고, 차이를 인정하거나 보류합니다.</text><rect x="634" y="353" width="193" height="47" rx="0" fill="#3a6049" stroke="none"/><text x="730" y="383" font-size="15" fill="#eef2e7" font-weight="600" text-anchor="middle">근거 확인 → 사람 승인</text><rect x="0" y="465" width="900" height="35" rx="0" fill="#e6ecdd" stroke="none"/><line x1="20" y1="464" x2="880" y2="464" stroke="#778570" stroke-width="1" /><text x="22" y="487" font-size="11" fill="#778570" font-weight="600" text-anchor="start">스타일 구상 · 미구현</text><text x="878" y="487" font-size="11" fill="#778570" font-weight="400" text-anchor="end">예시: 발주 100 · 입고 80 · 청구 100 / 단가 10,000 → 10,800원</text></g></svg>