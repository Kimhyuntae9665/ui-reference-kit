<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="입력에서 결과까지 읽는 노트 · 미구현 시안 · 합성 예시"><g font-family="Malgun Gothic,Segoe UI,sans-serif"><rect x="0" y="0" width="900" height="500" rx="0" fill="#f7f8f5" stroke="none"/><text x="30" y="31" font-size="16" fill="#566976" font-weight="600" text-anchor="start">24 / REACTIVE COMPUTATIONAL NOTEBOOK</text><text x="30" y="67" font-size="28" fill="#203340" font-weight="650" text-anchor="start">입력에서 결과까지 읽는 노트</text><text x="30" y="96" font-size="16" fill="#566976" font-weight="400" text-anchor="start">입력 → 계산 셀 → 출력의 의존 관계를 문서처럼 순서대로 보여줍니다.</text><rect x="30" y="121" width="840" height="323" rx="0" fill="#ffffff" stroke="#b9c7cd"/><rect x="30" y="121" width="63" height="323" rx="0" fill="#e9eeef" stroke="#b9c7cd"/><text x="62" y="167" font-size="18" fill="#566976" font-weight="600" text-anchor="middle">01</text><text x="110" y="150" font-size="16" fill="#167d8d" font-weight="600" text-anchor="start">INPUT / 값 변경</text><rect x="111" y="164" width="190" height="43" rx="0" fill="#dbedf0" stroke="#167d8d"/><text x="123" y="192" font-size="18" fill="#203340" font-weight="600" text-anchor="start">received = 80</text><rect x="318" y="164" width="203" height="43" rx="0" fill="#dbedf0" stroke="#167d8d"/><text x="330" y="192" font-size="18" fill="#203340" font-weight="600" text-anchor="start">invoice_qty = 100</text><rect x="537" y="164" width="309" height="43" rx="0" fill="#dbedf0" stroke="#167d8d"/><text x="549" y="192" font-size="18" fill="#203340" font-weight="600" text-anchor="start">price = 10,000 → 10,800</text><line x1="93" y1="222" x2="870" y2="222" stroke="#b9c7cd" stroke-width="1"/><text x="62" y="271" font-size="18" fill="#566976" font-weight="600" text-anchor="middle">02</text><text x="110" y="250" font-size="16" fill="#167d8d" font-weight="600" text-anchor="start">CODE / 의존 계산</text><text x="111" y="282" font-size="20" fill="#203340" font-weight="500" text-anchor="start">qty_gap = invoice_qty - received</text><text x="111" y="315" font-size="20" fill="#203340" font-weight="500" text-anchor="start">price_gap = invoice_price - po_price</text><line x1="93" y1="331" x2="870" y2="331" stroke="#b9c7cd" stroke-width="1"/><text x="62" y="380" font-size="18" fill="#566976" font-weight="600" text-anchor="middle">03</text><text x="110" y="360" font-size="16" fill="#167d8d" font-weight="600" text-anchor="start">OUTPUT / 파생 결과</text><text x="111" y="403" font-size="28" fill="#b97822" font-weight="650" text-anchor="start">수량 차이 20개</text><text x="414" y="403" font-size="28" fill="#b97822" font-weight="650" text-anchor="start">단가 차이 +800원</text><text x="110" y="432" font-size="16" fill="#566976" font-weight="400" text-anchor="start">입고 수량을 100으로 바꾸면 수량 차이만 0으로 갱신</text><path d="M852 183V390" stroke="#167d8d" stroke-width="3" fill="none"/><circle cx="852" cy="183" r="4" fill="#167d8d" stroke="none"/><circle cx="852" cy="279" r="4" fill="#167d8d" stroke="none"/><circle cx="852" cy="390" r="4" fill="#167d8d" stroke="none"/><line x1="30" y1="460" x2="870" y2="460" stroke="#b9c7cd" stroke-width="1"/><text x="30" y="486" font-size="16" fill="#566976" font-weight="600" text-anchor="start">미구현 시안 · 합성 예시</text><text x="870" y="486" font-size="16" fill="#566976" font-weight="400" text-anchor="end">STATIC CONCEPT STUDY</text></g></svg>
