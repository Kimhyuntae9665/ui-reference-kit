<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="메뉴 대신 다음 행동을 찾다 · 미구현 시안 · 합성 예시"><g font-family="Malgun Gothic,Segoe UI,sans-serif"><rect x="0" y="0" width="900" height="500" rx="0" fill="#f7f8f5" stroke="none"/><text x="30" y="31" font-size="16" fill="#566976" font-weight="600" text-anchor="start">26 / NESTED COMMAND PALETTE</text><text x="30" y="67" font-size="28" fill="#203340" font-weight="650" text-anchor="start">메뉴 대신 다음 행동을 찾다</text><text x="30" y="96" font-size="16" fill="#566976" font-weight="400" text-anchor="start">선택 문서의 맥락 안에서 동사부터 고르고 필요한 대상과 하위 행동을 좁힙니다.</text><rect x="30" y="124" width="840" height="320" rx="0" fill="#e7eceb" stroke="#b9c7cd"/><text x="53" y="160" font-size="18" fill="#566976" font-weight="400" text-anchor="start">선택 문서: PO-041  /  입고 80  /  청구 100</text><rect x="120" y="184" width="290" height="202" rx="0" fill="#ffffff" stroke="#b9c7cd"/><text x="140" y="216" font-size="20" fill="#203340" font-weight="650" text-anchor="start">무엇을 하시겠습니까</text><line x1="140" y1="232" x2="390" y2="232" stroke="#b9c7cd" stroke-width="1"/><rect x="132" y="245" width="266" height="45" rx="0" fill="#dbedf0" stroke="#167d8d"/><text x="149" y="275" font-size="20" fill="#167d8d" font-weight="600" text-anchor="start">차이를 설명하기</text><text x="380" y="275" font-size="24" fill="#167d8d" font-weight="600" text-anchor="end">›</text><text x="149" y="321" font-size="18" fill="#203340" font-weight="400" text-anchor="start">근거 문서 열기</text><text x="149" y="360" font-size="18" fill="#203340" font-weight="400" text-anchor="start">검토 담당자 지정</text><rect x="426" y="223" width="332" height="185" rx="0" fill="#ffffff" stroke="#167d8d"/><text x="444" y="253" font-size="18" fill="#566976" font-weight="600" text-anchor="start">차이를 설명하기  ›</text><line x1="444" y1="268" x2="740" y2="268" stroke="#b9c7cd" stroke-width="1"/><text x="445" y="301" font-size="20" fill="#203340" font-weight="600" text-anchor="start">수량차 원인 비교</text><rect x="437" y="314" width="310" height="43" rx="0" fill="#dbedf0" stroke="#167d8d"/><text x="445" y="343" font-size="20" fill="#167d8d" font-weight="600" text-anchor="start">분할 입고 여부 확인</text><text x="445" y="389" font-size="18" fill="#203340" font-weight="400" text-anchor="start">가격 변경 합의 찾기</text><path d="M398 265H417V336H437" stroke="#167d8d" stroke-width="2" fill="none"/><text x="121" y="430" font-size="18" fill="#203340" font-weight="600" text-anchor="start">행동 → 대상 → 다음 행동</text><text x="859" y="430" font-size="16" fill="#566976" font-weight="400" text-anchor="end">Esc 뒤로 · Enter 선택</text><line x1="30" y1="460" x2="870" y2="460" stroke="#b9c7cd" stroke-width="1"/><text x="30" y="486" font-size="16" fill="#566976" font-weight="600" text-anchor="start">미구현 시안 · 합성 예시</text><text x="870" y="486" font-size="16" fill="#566976" font-weight="400" text-anchor="end">STATIC CONCEPT STUDY</text></g></svg>
