fill="#92a1a9" font-weight="400" text-anchor="start">수량</text><text x="231" y="246" font-size="18" fill="#92a1a9" font-weight="400" text-anchor="start">입고</text><text x="512" y="246" font-size="18" fill="#92a1a9" font-weight="400" text-anchor="start">80개</text><text x="752" y="246" font-size="16" fill="#92a1a9" font-weight="400" text-anchor="start">근거 1건</text><rect x="220" y="267" width="638" height="118" rx="0" fill="#dbedf0" stroke="#167d8d"/><circle cx="245" cy="290" r="6" fill="#167d8d" stroke="none"/><text x="264" y="296" font-size="18" fill="#167d8d" font-weight="600" text-anchor="start">단가 · 같은 자리에서 의미 확장</text><text x="244" y="335" font-size="24" fill="#203340" font-weight="650" text-anchor="start">10,000원</text><text x="390" y="335" font-size="24" fill="#167d8d" font-weight="600" text-anchor="start">→</text><text x="430" y="335" font-size="24" fill="#203340" font-weight="650" text-anchor="start">10,800원</text><rect x="636" y="309" width="206" height="51" rx="0" fill="#f5e6cc" stroke="#b97822"/><text x="648" y="341" font-size="24" fill="#b97822" font-weight="650" text-anchor="start">+800원 · +8%</text><text x="244" y="369" font-size="16" fill="#566976" font-weight="400" text-anchor="start">주변 행은 유지 · 가격 근거와 차이만 상세화</text><text x="231" y="416" font-size="18" fill="#92a1a9" font-weight="400" text-anchor="start">검토 상태</text><text x="512" y="416" font-size="18" fill="#92a1a9" font-weight="400" text-anchor="start">사람 승인 대기</text><text x="870" y="452" font-size="16" fill="#566976" font-weight="400" text-anchor="end">위치의 기억을 유지하는 초점 / 맥락 전환</text><line x1="30" y1="460" x2="870" y2="460" stroke="#b9c7cd" stroke-width="1"/><text x="30" y="486" font-size="16" fill="#566976" font-weight="600" text-anchor="start">미구현 시안 · 합성 예시</text><text x="870" y="486" font-size="16" fill="#566976" font-weight="400" text-anchor="end">STATIC CONCEPT STUDY</text></g></svg>
