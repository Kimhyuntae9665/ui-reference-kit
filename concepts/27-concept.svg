<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="스크롤로 증거의 공간을 따라가다 · 미구현 시안 · 합성 예시"><g font-family="Malgun Gothic,Segoe UI,sans-serif"><rect x="0" y="0" width="900" height="500" rx="0" fill="#152a35" stroke="none"/><text x="30" y="31" font-size="16" fill="#91b2bf" font-weight="600" text-anchor="start">27 / SCROLL-DIRECTED SPATIAL STORY</text><text x="30" y="67" font-size="28" fill="#edf4f6" font-weight="650" text-anchor="start">스크롤로 증거의 공간을 따라가다</text><text x="30" y="96" font-size="16" fill="#acc4cc" font-weight="400" text-anchor="start">발주 → 입고 → 청구의 장면을 하나의 공간 경로와 카메라 이동으로 연결합니다.</text><line x1="65" y1="145" x2="65" y2="410" stroke="#47646f" stroke-width="3"/><circle cx="65" cy="160" r="10" fill="#7c9da9" stroke="none"/><circle cx="65" cy="265" r="13" fill="#4db6c7" stroke="none"/><circle cx="65" cy="394" r="10" fill="#7c9da9" stroke="none"/><text x="32" y="164" font-size="18" fill="#aec6cf" font-weight="600" text-anchor="middle">1</text><text x="32" y="270" font-size="18" fill="#bde7ee" font-weight="600" text-anchor="middle">2</text><text x="32" y="398" font-size="18" fill="#aec6cf" font-weight="600" text-anchor="middle">3</text><text x="86" y="156" font-size="16" fill="#aec6cf" font-weight="400" text-anchor="start">발주</text><text x="86" y="278" font-size="16" fill="#bde7ee" font-weight="600" text-anchor="start">입고</text><text x="86" y="407" font-size="16" fill="#aec6cf" font-weight="400" text-anchor="start">청구</text><path d="M165 379C215 335 232 176 355 186S474 381 585 340S716 151 845 201" stroke="#3a6373" stroke-width="10" fill="none"/><rect x="193" y="130" width="151" height="90" rx="0" fill="#233d49" stroke="#66828d"/><text x="209" y="164" font-size="18" fill="#b8d0d9" font-weight="600" text-anchor="start">01 / 발주</text><text x="209" y="198" font-size="26" fill="#e5f0f3" font-weight="650" text-anchor="start">100개</text><rect x="377" y="219" width="250" height="143" rx="0" fill="#194350" stroke="#72b8c5"/><text x="397" y="251" font-size="18" fill="#b4e5ee" font-weight="600" text-anchor="start">02 / 입고 확인</text><text x="397" y="290" font-size="32" fill="#f0f7f8" font-weight="650" text-anchor="start">80개 도착</text><text x="397" y="330" font-size="16" fill="#b4d4df" font-weight="400" text-anchor="start">20개가 다음 장면에 남음</text><rect x="708" y="137" width="149" height="94" rx="0" fill="#354038" stroke="#c49a58"/><text x="724" y="168" font-size="18" fill="#d6c7aa" font-weight="600" text-anchor="start">03 / 청구</text><text x="724" y="201" font-size="26" fill="#f5e3c3" font-weight="650" text-anchor="start">100개</text><rect x="364" y="205" width="276" height="171" rx="0" fill="none" stroke="#a9d9e3"/><path d="M364 225V205H384M620 205H640V225M364 356V376H384M620 376H640V356" stroke="#a9d9e3" stroke-width="3" fill="none"/><text x="383" y="403" font-size="18" fill="#a9d9e3" font-weight="600" text-anchor="start">현재 카메라 · 2 / 3</text><text x="193" y="438" font-size="18" fill="#b9ced6" font-weight="400" text-anchor="start">스크롤 ↓  공간을 이동하며 같은 20개의 의미를 이어갑니다.</text><line x1="30" y1="460" x2="870" y2="460" stroke="#47636f" stroke-width="1"/><text x="30" y="486" font-size="16" fill="#afc6ce" font-weight="600" text-anchor="start">미구현 시안 · 합성 예시</text><text x="870" y="486" font-size="16" fill="#afc6ce" font-weight="400" text-anchor="end">STATIC CONCEPT STUDY</text></g></svg>
