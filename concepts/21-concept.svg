<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="넓이로 읽고, 계층으로 확대 · 미구현 시안 · 합성 예시"><g font-family="Malgun Gothic,Segoe UI,sans-serif"><rect x="0" y="0" width="900" height="500" rx="0" fill="#f7f8f5" stroke="none"/><text x="30" y="31" font-size="16" fill="#566976" font-weight="600" text-anchor="start">21 / ZOOMABLE TREEMAP</text><text x="30" y="67" font-size="28" fill="#203340" font-weight="650" text-anchor="start">넓이로 읽고, 계층으로 확대</text><text x="30" y="96" font-size="16" fill="#566976" font-weight="400" text-anchor="start">합성 검토금액을 면적으로 배분하고 공급사 → 발주 → 문서로 내려갑니다.</text><text x="30" y="129" font-size="16" fill="#167d8d" font-weight="600" text-anchor="start">전체 1,200,000원  /  공급사 A  /  PO-041</text><rect x="30" y="148" width="600" height="282" rx="0" fill="#ffffff" stroke="#203340"/><rect x="30" y="148" width="360" height="282" rx="0" fill="#e0eef0" stroke="#203340"/><text x="48" y="176" font-size="20" fill="#203340" font-weight="650" text-anchor="start">공급사 A · 720,000</text><rect x="38" y="192" width="344" height="141" rx="0" fill="#bcdde2" stroke="#167d8d"/><text x="54" y="224" font-size="20" fill="#203340" font-weight="650" text-anchor="start">PO-041 · 450,000원</text><text x="54" y="254" font-size="18" fill="#203340" font-weight="400" text-anchor="start">수량 차이 20개</text><text x="54" y="284" font-size="16" fill="#167d8d" font-weight="600" text-anchor="start">확대 → 문서별 근거</text><rect x="38" y="341" width="344" height="81" rx="0" fill="#eaf3f4" stroke="#167d8d"/><text x="54" y="373" font-size="18" fill="#203340" font-weight="600" text-anchor="start">PO-042 · 270,000원</text><text x="54" y="403" font-size="16" fill="#566976" font-weight="400" text-anchor="start">단가 차이 +800원</text><rect x="390" y="148" width="150" height="282" rx="0" fill="#f0e7d8" stroke="#203340"/><text x="405" y="176" font-size="18" fill="#203340" font-weight="650" text-anchor="start">공급사 B</text><text x="405" y="204" font-size="18" fill="#203340" font-weight="400" text-anchor="start">300,000</text><rect x="398" y="221" width="134" height="119" rx="0" fill="#e3cba3" stroke="#b97822"/><text x="410" y="251" font-size="18" fill="#203340" font-weight="600" text-anchor="start">PO-061</text><text x="410" y="281" font-size="16" fill="#203340" font-weight="400" text-anchor="start">180,000</text><rect x="398" y="348" width="134" height="74" rx="0" fill="#f5e7cf" stroke="#b97822"/><text x="410" y="375" font-size="18" fill="#203340" font-weight="600" text-anchor="start">PO-062</text><text x="410" y="402" font-size="16" fill="#203340" font-weight="400" text-anchor="start">120,000</text><rect x="540" y="148" width="90" height="282" rx="0" fill="#e3e8e9" stroke="#203340"/><text x="550" y="176" font-size="16" fill="#203340" font-weight="600" text-anchor="start">공급사</text><text x="550" y="202" font-size="20" fill="#203340" font-weight="650" text-anchor="start">C</text><text x="550" y="236" font-size="16" fill="#203340" font-weight="400" text-anchor="start">180,000</text><text x="550" y="270" font-size="16" fill="#566976" font-weight="400" text-anchor="start">PO-078</text><rect x="660" y="148" width="210" height="282" rx="0" fill="#ffffff" stroke="#b9c7cd"/><text x="678" y="181" font-size="18" fill="#203340" font-weight="650" text-anchor="start">확대할 범위</text><text x="678" y="217" font-size="20" fill="#167d8d" font-weight="600" text-anchor="start">A → PO-041</text><text x="678" y="256" font-size="16" fill="#566976" font-weight="400" text-anchor="start">면적 = 예시 금액</text><line x1="678" y1="277" x2="851" y2="277" stroke="#b9c7cd" stroke-width="1"/><text x="678" y="312" font-size="18" fill="#203340" font-weight="400" text-anchor="start">전체 맥락은</text><text x="678" y="341" font-size="18" fill="#203340" font-weight="400" text-anchor="start">경로에 남기고</text><text x="678" y="370" font-size="18" fill="#203340" font-weight="400" text-anchor="start">하위 문서로 이동</text><text x="678" y="406" font-size="16" fill="#167d8d" font-weight="600" text-anchor="start">선택 영역