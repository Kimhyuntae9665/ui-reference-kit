<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="결과를 움직여 규칙을 고치다 · 미구현 시안 · 합성 예시"><g font-family="Malgun Gothic,Segoe UI,sans-serif"><rect x="0" y="0" width="900" height="500" rx="0" fill="#f7f8f5" stroke="none"/><text x="30" y="31" font-size="16" fill="#566976" font-weight="600" text-anchor="start">25 / DIRECT OUTPUT MANIPULATION</text><text x="30" y="67" font-size="28" fill="#203340" font-weight="650" text-anchor="start">결과를 움직여 규칙을 고치다</text><text x="30" y="96" font-size="16" fill="#566976" font-weight="400" text-anchor="start">판정 경계를 옮기면 같은 규칙을 표현하는 소스 변경안을 제안합니다.</text><rect x="30" y="125" width="413" height="291" rx="0" fill="#152a35" stroke="#152a35"/><text x="49" y="156" font-size="16" fill="#8eb4c3" font-weight="600" text-anchor="start">SOURCE / 규칙</text><text x="49" y="200" font-size="22" fill="#e3edef" font-weight="500" text-anchor="start">rule {</text><text x="70" y="240" font-size="22" fill="#e3edef" font-weight="500" text-anchor="start">price_tolerance:</text><text x="70" y="279" font-size="22" fill="#e3edef" font-weight="500" text-anchor="start">  unit: 'percent'</text><text x="49" y="319" font-size="22" fill="#e3edef" font-weight="500" text-anchor="start">}</text><rect x="278" y="215" width="29" height="36" rx="0" fill="#263f4b" stroke="#d7a34c"/><text x="292" y="240" font-size="22" fill="#f6c975" font-weight="650" text-anchor="middle">8</text><text x="49" y="382" font-size="18" fill="#b5cbd2" font-weight="400" text-anchor="start">diff: 5 → 8  /  승인 전 변경</text><line x1="443" y1="273" x2="496" y2="273" stroke="#167d8d" stroke-width="2"/><path d="M489 268 L496 273 L489 278" fill="none" stroke="#167d8d" stroke-width="2"/><line x1="496" y1="314" x2="443" y2="314" stroke="#b97822" stroke-width="2"/><path d="M436 309 L443 314 L436 319" fill="none" stroke="#b97822" stroke-width="2"/><text x="504" y="154" font-size="18" fill="#203340" font-weight="600" text-anchor="start">OUTPUT / 판정 경계 직접 이동</text><rect x="504" y="172" width="366" height="244" rx="0" fill="#ffffff" stroke="#b9c7cd"/><line x1="532" y1="299" x2="842" y2="299" stroke="#203340" stroke-width="2"/><rect x="532" y="237" width="155" height="62" rx="0" fill="#dbedf0" stroke="none"/><rect x="687" y="237" width="93" height="62" rx="0" fill="#b9dfe4" stroke="none"/><rect x="780" y="237" width="62" height="62" rx="0" fill="#f5e6cc" stroke="none"/><line x1="687" y1="226" x2="687" y2="333" stroke="#566976" stroke-width="2" stroke-dasharray="5 5"/><line x1="780" y1="217" x2="780" y2="333" stroke="#b97822" stroke-width="3"/><circle cx="780" cy="237" r="9" fill="#b97822" stroke="none"/><text x="532" y="355" font-size="18" fill="#566976" font-weight="400" text-anchor="start">0%</text><text x="687" y="355" font-size="18" fill="#566976" font-weight="400" text-anchor="middle">5%</text><text x="780" y="355" font-size="18" fill="#b97822" font-weight="650" text-anchor="middle">8%</text><text x="842" y="355" font-size="18" fill="#566976" font-weight="400" text-anchor="end">10%</text><text x="529" y="200" font-size="20" fill="#b97822" font-weight="650" text-anchor="start">경계 핸들 5% → 8%</text><text x="529" y="395" font-size="16" fill="#203340" font-weight="400" text-anchor="start">예시 단가차 8% · 경계에 위치</text><text x="30" y="444" font-size="18" fill="#203340" font-weight="600" text-anchor="start">출력 조작 → 소스 변경안 생성 → 사람이 변경 승인</text><line x1="30" y1="460" x2="870" y2="460" stroke="#b9c7cd" stroke-width="1"/><text x="30" y="486" font-size="16" fill="#566976" font-weight="600" text-anchor="start">미구현 시안 · 합성 예시</text><text x="870" y="486" font-size="16" fill="#566976" font-weight="400" text-anchor="end">STATIC CONCEPT STUDY</text></g></svg>
